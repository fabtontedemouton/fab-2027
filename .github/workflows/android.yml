
name: Build FAB 2027 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/fr/fabtontedemouton/fabmatrix
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/www
          cp MainActivity.java app/src/main/java/fr/fabtontedemouton/fabmatrix/
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/
          cp index.html styles.css app.js app/src/main/assets/www/
          sed -i "s/FAB' MATRIX 2027/FAB 2027/g" app/src/main/AndroidManifest.xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "FAB2027"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'fr.fabtontedemouton.fabmatrix'
            compileSdk 35
            defaultConfig {
              applicationId 'fr.fabtontedemouton.fabmatrix'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FAB-2027-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
